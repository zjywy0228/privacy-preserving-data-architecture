<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title description">
  <title id="title">Differential-Privacy Budget Sensitivity (Synthetic Plan)</title>
  <desc id="description">Noise multiplier versus epsilon on a logarithmic epsilon axis, with the target privacy budget marked.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #172033; }
    .axis { stroke: #334155; stroke-width: 1.5; }
    .grid { stroke: #cbd5e1; stroke-width: 1; }
    .curve { fill: none; stroke: #0369a1; stroke-width: 3; }
    .target { stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 8 5; }
    .within { fill: #16a34a; stroke: #14532d; stroke-width: 1.5; }
    .over { fill: #dc2626; stroke: #7f1d1d; stroke-width: 1.5; }
    .tick { font-size: 12px; }
    .label { font-size: 14px; font-weight: 600; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="450.0" y="32" text-anchor="middle" font-size="22" font-weight="700">Differential-Privacy Budget Sensitivity (Synthetic Plan)</text>
  <text x="450.0" y="54" text-anchor="middle" font-size="12">batch=64 · dataset=50000 · delta=1e-05 · epochs=5</text>
  <g>
    <line x1="79" y1="455.00" x2="865" y2="455.00" class="grid" /><text x="73" y="459.00" class="tick" text-anchor="end">0.106</text>
    <line x1="79" y1="360.00" x2="865" y2="360.00" class="grid" /><text x="73" y="364.00" class="tick" text-anchor="end">0.261</text>
    <line x1="79" y1="265.00" x2="865" y2="265.00" class="grid" /><text x="73" y="269.00" class="tick" text-anchor="end">0.639</text>
    <line x1="79" y1="170.00" x2="865" y2="170.00" class="grid" /><text x="73" y="174.00" class="tick" text-anchor="end">1.57</text>
    <line x1="79" y1="75.00" x2="865" y2="75.00" class="grid" /><text x="73" y="79.00" class="tick" text-anchor="end">3.84</text>
    <line x1="85.00" y1="455" x2="85.00" y2="461" /><text x="85.00" y="479" class="tick" text-anchor="middle">0.5</text>
    <line x1="178.60" y1="455" x2="178.60" y2="461" /><text x="178.60" y="479" class="tick" text-anchor="middle">0.8</text>
    <line x1="241.00" y1="455" x2="241.00" y2="461" /><text x="241.00" y="479" class="tick" text-anchor="middle">1</text>
    <line x1="397.00" y1="455" x2="397.00" y2="461" /><text x="397.00" y="479" class="tick" text-anchor="middle">1.5</text>
    <line x1="553.00" y1="455" x2="553.00" y2="461" /><text x="553.00" y="479" class="tick" text-anchor="middle">2</text>
    <line x1="865.00" y1="455" x2="865.00" y2="461" /><text x="865.00" y="479" class="tick" text-anchor="middle">3</text>
    <line x1="85" y1="75" x2="85" y2="455" class="axis" />
    <line x1="85" y1="455" x2="865" y2="455" class="axis" />
    <line x1="85" y1="101.21" x2="865" y2="101.21" class="target" />
    <text x="861" y="93.21" text-anchor="end" class="tick">target epsilon=3</text>
    <polyline points="85.00,243.85 178.60,294.29 241.00,318.13 397.00,361.40 553.00,392.03 865.00,428.79" class="curve" />
    <circle cx="85.00" cy="243.85" r="5" class="within"><title>sigma=0.5, epsilon=0.7805, within budget</title></circle>
    <circle cx="178.60" cy="294.29" r="5" class="within"><title>sigma=0.8, epsilon=0.4848, within budget</title></circle>
    <circle cx="241.00" cy="318.13" r="5" class="within"><title>sigma=1, epsilon=0.3871, within budget</title></circle>
    <circle cx="397.00" cy="361.40" r="5" class="within"><title>sigma=1.5, epsilon=0.2573, within budget</title></circle>
    <circle cx="553.00" cy="392.03" r="5" class="within"><title>sigma=2, epsilon=0.1927, within budget</title></circle>
    <circle cx="865.00" cy="428.79" r="5" class="within"><title>sigma=3, epsilon=0.1362, within budget</title></circle>
  </g>
  <text x="475.0" y="510" text-anchor="middle" class="label">Noise multiplier (sigma)</text>
  <text x="22" y="265.0" text-anchor="middle" class="label" transform="rotate(-90 22 265.0)">Epsilon (log scale)</text>
  <g transform="translate(95 482)">
    <circle cx="0" cy="0" r="5" class="within" /><text x="12" y="4" class="tick">within target</text>
    <circle cx="120" cy="0" r="5" class="over" /><text x="132" y="4" class="tick">over target</text>
  </g>
